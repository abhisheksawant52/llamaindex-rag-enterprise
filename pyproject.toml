[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llamaindex-rag-enterprise"
version = "0.1.0"
description = "Enterprise-grade Retrieval-Augmented Generation service built on LlamaIndex and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sawant" }]
keywords = ["rag", "llamaindex", "llm", "fastapi", "retrieval-augmented-generation"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "llama-index>=0.10",
    "llama-index-core>=0.10",
    "llama-index-llms-openai>=0.1",
    "llama-index-embeddings-openai>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/abhisheksawant52/llamaindex-rag-enterprise"
Issues = "https://github.com/abhisheksawant52/llamaindex-rag-enterprise/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
